<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="624" viewBox="0 0 1640 624" font-family="'Helvetica Neue', Arial, sans-serif">

  <!-- LEFT HALF — dark green -->
  <rect x="0" y="0" width="820" height="624" fill="#0D2318"/>

  <!-- Orange top accent bar -->
  <rect x="0" y="0" width="820" height="5" fill="#FF6B35"/>

  <!-- Brand name -->
  <text x="72" y="138" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-2">SoinsMboa</text>

  <!-- Tagline -->
  <text x="72" y="190" font-size="20" fill="#F8F5F0" fill-opacity="0.55" letter-spacing="0.5">Soins à domicile · Douala &amp; Yaoundé</text>

  <!-- Short accent rule -->
  <rect x="72" y="216" width="260" height="2" fill="#FF6B35"/>

  <!-- Availability badge -->
  <rect x="72" y="240" width="210" height="38" rx="4" fill="#FF6B35"/>
  <text x="177" y="264" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">24h/24 · 7j/7</text>

  <!-- Supporting copy -->
  <text x="72" y="340" font-size="17" fill="#F8F5F0" fill-opacity="0.48">Personnel qualifié · Intervention &lt;24h</text>
  <text x="72" y="366" font-size="17" fill="#F8F5F0" fill-opacity="0.48">Compte-rendu famille quotidien</text>

  <!-- Diaspora line -->
  <text x="72" y="430" font-size="14" fill="#F8F5F0" fill-opacity="0.3" letter-spacing="0.3">Pour la diaspora · France · Belgique · Canada</text>

  <!-- Footer micro text -->
  <rect x="72" y="570" width="680" height="1" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="72" y="600" font-size="12" fill="#F8F5F0" fill-opacity="0.28" letter-spacing="0.3">SoinsMboa.com</text>

  <!-- VERTICAL DIVIDER -->
  <rect x="820" y="0" width="4" height="624" fill="#FF6B35"/>

  <!-- RIGHT HALF — off-white -->
  <rect x="824" y="0" width="816" height="624" fill="#F8F5F0"/>

  <!-- Headline -->
  <text x="892" y="108" font-size="38" font-weight="800" fill="#0D2318" letter-spacing="-0.5">Soins à domicile professionnels</text>
  <text x="892" y="156" font-size="38" font-weight="800" fill="#1A6B4A" letter-spacing="-0.5">au Cameroun</text>

  <!-- Rule -->
  <rect x="892" y="180" width="620" height="1.5" fill="#0D2318" fill-opacity="0.1"/>

  <!-- Phone boxes — two side by side, full number on each -->
  <!-- Box 1 — dark background -->
  <rect x="892" y="204" width="292" height="118" rx="6" fill="#0D2318"/>
  <text x="1038" y="240" font-size="11" fill="#F8F5F0" fill-opacity="0.5" text-anchor="middle" letter-spacing="2">WHATSAPP · APPEL</text>
  <text x="1038" y="287" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">+237 6 99</text>
  <text x="1038" y="316" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">77 48 82</text>

  <!-- Box 2 — green background -->
  <rect x="1202" y="204" width="292" height="118" rx="6" fill="#1A6B4A"/>
  <text x="1348" y="240" font-size="11" fill="#F8F5F0" fill-opacity="0.7" text-anchor="middle" letter-spacing="2">WHATSAPP · APPEL</text>
  <text x="1348" y="287" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">+237 7 55</text>
  <text x="1348" y="316" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">30 42 49</text>

  <!-- Rule -->
  <rect x="892" y="344" width="620" height="1.5" fill="#0D2318" fill-opacity="0.08"/>

  <!-- Services label -->
  <text x="892" y="382" font-size="11" font-weight="700" fill="#FF6B35" letter-spacing="3">NOS SERVICES</text>

  <!-- 3 service tags -->
  <rect x="892" y="400" width="186" height="42" rx="4" fill="#FFFFFF"/>
  <rect x="892" y="400" width="4" height="42" rx="1" fill="#1A6B4A"/>
  <text x="986" y="426" font-size="15" font-weight="700" fill="#0D2318" text-anchor="middle">Auxiliaire de vie</text>

  <rect x="1096" y="400" width="186" height="42" rx="4" fill="#FFFFFF"/>
  <rect x="1096" y="400" width="4" height="42" rx="1" fill="#1A6B4A"/>
  <text x="1190" y="426" font-size="15" font-weight="700" fill="#0D2318" text-anchor="middle">Garde-malade</text>

  <rect x="1300" y="400" width="196" height="42" rx="4" fill="#FFFFFF"/>
  <rect x="1300" y="400" width="4" height="42" rx="1" fill="#FF6B35"/>
  <text x="1399" y="426" font-size="15" font-weight="700" fill="#0D2318" text-anchor="middle">Médecin à domicile</text>

  <!-- Bottom strip — dark, with both full phone numbers large -->
  <rect x="824" y="500" width="816" height="124" fill="#0D2318"/>
  <rect x="824" y="500" width="816" height="4" fill="#FF6B35"/>

  <text x="892" y="548" font-size="11" fill="#F8F5F0" fill-opacity="0.4" letter-spacing="2">NOUS APPELER</text>
  <text x="892" y="590" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">+237 6 99 77 48 82</text>

  <text x="1300" y="548" font-size="11" fill="#F8F5F0" fill-opacity="0.4" letter-spacing="2">OU</text>
  <text x="1300" y="590" font-size="34" font-weight="800" fill="#FF6B35" letter-spacing="-0.5">+237 7 55 30 42 49</text>

</svg>
