<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1080" height="1920" viewBox="0 0 1080 1920"
     font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="g-photo-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0D2318" stop-opacity="0.92"/>
      <stop offset="25%"  stop-color="#0D2318" stop-opacity="0.1"/>
      <stop offset="60%"  stop-color="#0D2318" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0D2318" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g-orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#e85a24"/>
    </linearGradient>
    <linearGradient id="g-green-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1A6B4A"/>
      <stop offset="100%" stop-color="#0f4a33"/>
    </linearGradient>
    <clipPath id="photo-clip">
      <rect x="0" y="0" width="1080" height="900"/>
    </clipPath>
  </defs>

  <!-- ── Fond sombre base ── -->
  <rect width="1080" height="1920" fill="#0D2318"/>

  <!-- ── Photo : mains soignante/personne âgée noires ── -->
  <image href="../images/service-auxiliaire.jpg"
         x="0" y="0" width="1080" height="900"
         preserveAspectRatio="xMidYMid slice"
         clip-path="url(#photo-clip)"/>

  <!-- Overlay gradient sur la photo -->
  <rect x="0" y="0" width="1080" height="900" fill="url(#g-photo-top)"/>

  <!-- ── HEADER brand ── -->
  <rect x="60" y="70"  width="52" height="5" rx="2.5" fill="#FF6B35"/>
  <text x="60" y="144" font-size="60" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">SoinsMboa</text>
  <text x="60" y="182" font-size="15" fill="#F8F5F0" fill-opacity="0.5" letter-spacing="4.5">DOUALA · YAOUNDÉ</text>

  <!-- Badge -->
  <rect x="856" y="70" width="164" height="44" rx="22" fill="url(#g-orange)"/>
  <text x="938" y="97" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">24h/24 · 7j/7</text>

  <!-- ── HEADLINE sur la photo ── -->
  <text x="60" y="658" font-size="88" font-weight="800" fill="#FFFFFF" letter-spacing="-3">On s'occupe</text>
  <text x="60" y="758" font-size="88" font-weight="800" fill="#FF6B35" letter-spacing="-3">de lui.</text>
  <text x="60" y="830" font-size="26" fill="#F8F5F0" fill-opacity="0.8" letter-spacing="0.3">Soignant qualifié · Intervention &lt;24h</text>

  <!-- ── SECTION SERVICES (fond sombre, après la photo) ── -->
  <text x="540" y="960" font-size="12" font-weight="700" fill="#FF6B35" text-anchor="middle" letter-spacing="4">NOS SERVICES</text>
  <rect x="390" y="974" width="300" height="2" fill="#FF6B35" fill-opacity="0.5"/>

  <!-- Card 1 — Auxiliaire de vie -->
  <rect x="60" y="996" width="960" height="130" rx="8" fill="#FFFFFF" fill-opacity="0.06"/>
  <rect x="60" y="996" width="960" height="130" rx="8" fill="none" stroke="#1A6B4A" stroke-width="1.5"/>
  <rect x="60" y="996" width="6"   height="130" rx="3" fill="#1A6B4A"/>
  <!-- Cross icon -->
  <rect x="107" y="1042" width="6" height="36" rx="2" fill="#1A6B4A"/>
  <rect x="93"  y="1054" width="34" height="12" rx="2" fill="#1A6B4A"/>
  <text x="168" y="1042" font-size="26" font-weight="800" fill="#FFFFFF">Auxiliaire de vie</text>
  <text x="168" y="1076" font-size="17" fill="#F8F5F0" fill-opacity="0.5">Aide quotidienne · Toilette · Repas · Sorties</text>
  <text x="168" y="1108" font-size="13" font-weight="700" fill="#1A6B4A" letter-spacing="0.5">Disponible 7j/7</text>

  <!-- Card 2 — Garde-malade -->
  <rect x="60" y="1146" width="960" height="130" rx="8" fill="#FFFFFF" fill-opacity="0.06"/>
  <rect x="60" y="1146" width="960" height="130" rx="8" fill="none" stroke="#1A6B4A" stroke-width="1.5"/>
  <rect x="60" y="1146" width="6"   height="130" rx="3" fill="#1A6B4A"/>
  <!-- Eye icon -->
  <circle cx="111" cy="1212" r="18" fill="none" stroke="#1A6B4A" stroke-width="4"/>
  <circle cx="111" cy="1212" r="7"  fill="#1A6B4A"/>
  <text x="168" y="1192" font-size="26" font-weight="800" fill="#FFFFFF">Garde-malade</text>
  <text x="168" y="1226" font-size="17" fill="#F8F5F0" fill-opacity="0.5">Surveillance 24h · Hôpital ou à domicile</text>
  <text x="168" y="1258" font-size="13" font-weight="700" fill="#1A6B4A" letter-spacing="0.5">Jour et nuit</text>

  <!-- Card 3 — Médecin à domicile -->
  <rect x="60" y="1296" width="960" height="130" rx="8" fill="#FF6B35" fill-opacity="0.1"/>
  <rect x="60" y="1296" width="960" height="130" rx="8" fill="none" stroke="#FF6B35" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="60" y="1296" width="6"   height="130" rx="3" fill="#FF6B35"/>
  <!-- Stethoscope icon -->
  <circle cx="111" cy="1344" r="14" fill="none" stroke="#FF6B35" stroke-width="4"/>
  <path d="M 111 1358 Q 111 1380 132 1380 Q 153 1380 153 1360" fill="none" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
  <circle cx="153" cy="1358" r="6" fill="#FF6B35"/>
  <text x="168" y="1340" font-size="26" font-weight="800" fill="#FFFFFF">Médecin à domicile</text>
  <text x="168" y="1374" font-size="17" fill="#F8F5F0" fill-opacity="0.5">Consultation · Ordonnance · Suivi post-op</text>
  <text x="168" y="1406" font-size="13" font-weight="700" fill="#FF6B35" letter-spacing="0.5">Intervention rapide</text>

  <!-- ── DIASPORA MESSAGE ── -->
  <rect x="60" y="1460" width="960" height="2" fill="#FFFFFF" fill-opacity="0.07"/>
  <text x="540" y="1528" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Vous êtes à l'étranger ?</text>
  <text x="540" y="1566" font-size="28" font-weight="700" fill="#4ade80" text-anchor="middle">Gérez tout par WhatsApp.</text>
  <text x="540" y="1612" font-size="19" fill="#F8F5F0" fill-opacity="0.5" text-anchor="middle">Compte-rendu quotidien · France · Belgique · Canada</text>
  <rect x="60" y="1646" width="960" height="2" fill="#FFFFFF" fill-opacity="0.07"/>

  <!-- ── SECTION CONTACT orange ── -->
  <rect x="0" y="1676" width="1080" height="244" fill="#FF6B35"/>
  <rect x="0" y="1676" width="1080" height="4" fill="#0D2318" fill-opacity="0.2"/>

  <text x="540" y="1736" font-size="13" font-weight="700" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle" letter-spacing="4">NOUS APPELER</text>

  <!-- Téléphone 1 -->
  <rect x="60"  y="1752" width="960" height="88" rx="8" fill="#0D2318" fill-opacity="0.22"/>
  <text x="540" y="1794" font-size="14" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle" letter-spacing="2">WhatsApp · Appel · SMS</text>
  <text x="540" y="1832" font-size="50" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">+237 6 99 77 48 82</text>

  <!-- Séparateur subtil -->
  <text x="540" y="1864" font-size="12" fill="#FFFFFF" fill-opacity="0.4" text-anchor="middle" letter-spacing="2">—  OU  —</text>

  <!-- Téléphone 2 -->
  <text x="540" y="1900" font-size="36" font-weight="700" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle" letter-spacing="-0.5">+237 6 76 81 47 85</text>

  <!-- ── FOOTER ── -->
  <rect x="0" y="1860" width="1080" height="60" fill="#0D2318" fill-opacity="0.45"/>
  <text x="540" y="1896" font-size="14" fill="#F8F5F0" fill-opacity="0.4" text-anchor="middle" letter-spacing="0.5">Personnel qualifié · Évaluation gratuite · SoinsMboa.com</text>
</svg>
