<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" font-family="'Helvetica Neue', Arial, sans-serif">

  <!-- Full background — off-white -->
  <rect width="1080" height="1920" fill="#F8F5F0"/>

  <!-- TOP HEADER — dark green, 30% height = 576px -->
  <rect x="0" y="0" width="1080" height="576" fill="#0D2318"/>

  <!-- Thin orange accent line at very top -->
  <rect x="0" y="0" width="1080" height="5" fill="#FF6B35"/>

  <!-- Brand name -->
  <text x="540" y="150" font-size="80" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">SoinsMboa</text>

  <!-- Small caps location -->
  <text x="540" y="208" font-size="18" font-weight="600" fill="#F8F5F0" fill-opacity="0.55" text-anchor="middle" letter-spacing="5">DOUALA · YAOUNDÉ</text>

  <!-- Thin rule -->
  <rect x="240" y="240" width="600" height="1.5" fill="#FFFFFF" fill-opacity="0.12"/>

  <!-- Tagline -->
  <text x="540" y="292" font-size="20" font-weight="400" fill="#F8F5F0" fill-opacity="0.65" text-anchor="middle" letter-spacing="1">Soins à domicile · Cameroun</text>

  <!-- Big hero headline inside green header -->
  <text x="540" y="396" font-size="82" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">On s'occupe</text>
  <text x="540" y="490" font-size="82" font-weight="800" fill="#FF6B35" text-anchor="middle" letter-spacing="-2">de lui.</text>

  <!-- Sub-text under headline still in header area -->
  <text x="540" y="548" font-size="22" fill="#F8F5F0" fill-opacity="0.6" text-anchor="middle">Soignant qualifié · Intervention en moins de 24h</text>

  <!-- MIDDLE SECTION — off-white, service cards -->
  <!-- Section label -->
  <text x="540" y="644" font-size="12" font-weight="700" fill="#1A6B4A" text-anchor="middle" letter-spacing="4">NOS SERVICES</text>

  <!-- Thin accent rule under label -->
  <rect x="440" y="658" width="200" height="2" fill="#FF6B35"/>

  <!-- SERVICE CARD 1 — Auxiliaire de vie -->
  <rect x="60" y="686" width="960" height="154" rx="6" fill="#FFFFFF"/>
  <!-- Left color bar -->
  <rect x="60" y="686" width="5" height="154" rx="2" fill="#1A6B4A"/>
  <!-- SVG cross icon -->
  <rect x="108" y="730" width="6" height="30" rx="2" fill="#1A6B4A"/>
  <rect x="96" y="739" width="30" height="12" rx="2" fill="#1A6B4A"/>
  <!-- Text -->
  <text x="156" y="730" font-size="28" font-weight="800" fill="#0D2318">Auxiliaire de vie</text>
  <text x="156" y="768" font-size="18" fill="#0D2318" fill-opacity="0.5">Aide quotidienne · Toilette · Repas · Sorties</text>
  <text x="156" y="820" font-size="14" font-weight="700" fill="#1A6B4A" letter-spacing="0.5">Disponible 7j/7</text>

  <!-- SERVICE CARD 2 — Garde-malade -->
  <rect x="60" y="860" width="960" height="154" rx="6" fill="#FFFFFF"/>
  <rect x="60" y="860" width="5" height="154" rx="2" fill="#1A6B4A"/>
  <!-- SVG eye icon -->
  <circle cx="111" cy="937" r="17" fill="none" stroke="#1A6B4A" stroke-width="4"/>
  <circle cx="111" cy="937" r="6" fill="#1A6B4A"/>
  <!-- Text -->
  <text x="156" y="904" font-size="28" font-weight="800" fill="#0D2318">Garde-malade</text>
  <text x="156" y="942" font-size="18" fill="#0D2318" fill-opacity="0.5">Surveillance 24h · Hôpital ou domicile</text>
  <text x="156" y="994" font-size="14" font-weight="700" fill="#1A6B4A" letter-spacing="0.5">Jour et nuit</text>

  <!-- SERVICE CARD 3 — Médecin à domicile -->
  <rect x="60" y="1034" width="960" height="154" rx="6" fill="#FFFFFF"/>
  <rect x="60" y="1034" width="5" height="154" rx="2" fill="#FF6B35"/>
  <!-- SVG stethoscope-like icon: circle + curve -->
  <circle cx="111" cy="1094" r="14" fill="none" stroke="#FF6B35" stroke-width="4"/>
  <path d="M 111 1108 Q 111 1130 130 1130 Q 149 1130 149 1111" fill="none" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
  <circle cx="149" cy="1109" r="5" fill="#FF6B35"/>
  <!-- Text -->
  <text x="156" y="1078" font-size="28" font-weight="800" fill="#0D2318">Médecin à domicile</text>
  <text x="156" y="1116" font-size="18" fill="#0D2318" fill-opacity="0.5">Consultation · Ordonnance · Suivi post-op</text>
  <text x="156" y="1168" font-size="14" font-weight="700" fill="#FF6B35" letter-spacing="0.5">Intervention rapide</text>

  <!-- DIASPORA MESSAGE — mid section -->
  <rect x="60" y="1224" width="960" height="2" fill="#0D2318" fill-opacity="0.08"/>
  <text x="540" y="1294" font-size="26" font-weight="700" fill="#0D2318" text-anchor="middle">Vous êtes en France, Belgique,</text>
  <text x="540" y="1332" font-size="26" font-weight="700" fill="#0D2318" text-anchor="middle">Canada — votre parent est au pays ?</text>
  <text x="540" y="1384" font-size="19" fill="#0D2318" fill-opacity="0.5" text-anchor="middle">Gérez tout par WhatsApp. Compte-rendu quotidien.</text>
  <rect x="60" y="1416" width="960" height="2" fill="#0D2318" fill-opacity="0.08"/>

  <!-- BOTTOM CONTACT SECTION — solid orange -->
  <rect x="0" y="1456" width="1080" height="464" fill="#FF6B35"/>

  <!-- Thin dark top border on orange section -->
  <rect x="0" y="1456" width="1080" height="4" fill="#0D2318" fill-opacity="0.2"/>

  <!-- Contact label -->
  <text x="540" y="1526" font-size="13" font-weight="700" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle" letter-spacing="4">NOUS APPELER</text>

  <!-- Phone 1 — huge, the visual star -->
  <rect x="60" y="1548" width="960" height="126" rx="6" fill="#0D2318" fill-opacity="0.2"/>
  <text x="540" y="1596" font-size="14" fill="#FFFFFF" fill-opacity="0.65" text-anchor="middle" letter-spacing="2">WhatsApp · Appel · SMS</text>
  <text x="540" y="1656" font-size="58" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">+237 6 99 77 48 82</text>

  <!-- Phone 2 — huge -->
  <rect x="60" y="1692" width="960" height="126" rx="6" fill="#0D2318" fill-opacity="0.2"/>
  <text x="540" y="1740" font-size="14" fill="#FFFFFF" fill-opacity="0.65" text-anchor="middle" letter-spacing="2">WhatsApp · Appel · SMS</text>
  <text x="540" y="1800" font-size="58" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">+237 6 76 81 47 85</text>

  <!-- Footer bar -->
  <rect x="0" y="1860" width="1080" height="60" fill="#0D2318"/>
  <text x="540" y="1896" font-size="14" fill="#F8F5F0" fill-opacity="0.55" text-anchor="middle" letter-spacing="0.5">Personnel qualifié · Évaluation gratuite · SoinsMboa.com</text>

</svg>
