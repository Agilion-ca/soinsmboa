<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="'Helvetica Neue', Arial, sans-serif">

  <!-- LEFT PANEL — dark green, 40% width -->
  <rect x="0" y="0" width="432" height="1080" fill="#0D2318"/>

  <!-- Thin accent line top of left panel -->
  <rect x="60" y="80" width="3" height="60" fill="#FF6B35"/>

  <!-- Brand name vertical left panel -->
  <text x="80" y="152" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Soins</text>
  <text x="80" y="200" font-size="42" font-weight="800" fill="#1A6B4A">Mboa</text>

  <!-- Divider line under brand -->
  <rect x="80" y="220" width="180" height="2" fill="#FF6B35"/>

  <!-- Tagline -->
  <text x="80" y="264" font-size="16" fill="#F8F5F0" font-weight="400" letter-spacing="0.5">Soins à domicile</text>
  <text x="80" y="288" font-size="16" fill="#F8F5F0" fill-opacity="0.6" letter-spacing="0.5">Douala &amp; Yaoundé</text>

  <!-- Availability badge -->
  <rect x="80" y="340" width="180" height="36" rx="4" fill="#FF6B35"/>
  <text x="170" y="363" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">24h/24 · 7j/7</text>

  <!-- Services label -->
  <text x="80" y="460" font-size="11" font-weight="700" fill="#FF6B35" letter-spacing="2.5">NOS SERVICES</text>

  <!-- Service list left panel -->
  <rect x="80" y="476" width="2" height="32" fill="#FF6B35"/>
  <text x="96" y="490" font-size="17" font-weight="700" fill="#FFFFFF">Auxiliaire de vie</text>
  <text x="96" y="510" font-size="13" fill="#F8F5F0" fill-opacity="0.55">Aide quotidienne, toilette, repas</text>

  <rect x="80" y="524" width="2" height="32" fill="#1A6B4A"/>
  <text x="96" y="538" font-size="17" font-weight="700" fill="#FFFFFF">Garde-malade</text>
  <text x="96" y="558" font-size="13" fill="#F8F5F0" fill-opacity="0.55">Surveillance jour et nuit</text>

  <rect x="80" y="572" width="2" height="32" fill="#1A6B4A"/>
  <text x="96" y="586" font-size="17" font-weight="700" fill="#FFFFFF">Médecin à domicile</text>
  <text x="96" y="606" font-size="13" fill="#F8F5F0" fill-opacity="0.55">Consultation, ordonnance, suivi</text>

  <!-- Diaspora note left panel bottom -->
  <rect x="80" y="960" width="280" height="1" fill="#FFFFFF" fill-opacity="0.12"/>
  <text x="80" y="992" font-size="13" fill="#F8F5F0" fill-opacity="0.5">Pour la diaspora</text>
  <text x="80" y="1012" font-size="13" fill="#F8F5F0" fill-opacity="0.5">en France, Belgique, Canada</text>
  <text x="80" y="1048" font-size="12" fill="#F8F5F0" fill-opacity="0.3">SoinsMboa.com</text>

  <!-- RIGHT PANEL — off-white -->
  <rect x="432" y="0" width="648" height="1080" fill="#F8F5F0"/>

  <!-- Thin vertical accent line between panels -->
  <rect x="432" y="0" width="4" height="1080" fill="#FF6B35"/>

  <!-- Headline top-right -->
  <text x="492" y="148" font-size="56" font-weight="800" fill="#0D2318" letter-spacing="-1.5">Votre parent</text>
  <text x="492" y="214" font-size="56" font-weight="800" fill="#0D2318" letter-spacing="-1.5">est malade</text>
  <text x="492" y="280" font-size="56" font-weight="800" fill="#1A6B4A" letter-spacing="-1.5">au Cameroun ?</text>

  <!-- Sub-headline -->
  <text x="492" y="336" font-size="20" fill="#0D2318" fill-opacity="0.55" font-weight="400">Nous envoyons un soignant qualifié</text>
  <text x="492" y="362" font-size="20" fill="#0D2318" fill-opacity="0.55" font-weight="400">en moins de 24h — à domicile ou à l'hôpital.</text>

  <!-- Thin horizontal rule -->
  <rect x="492" y="396" width="540" height="1.5" fill="#0D2318" fill-opacity="0.1"/>

  <!-- 3-column services grid -->
  <!-- Column 1 -->
  <rect x="492" y="424" width="160" height="200" rx="6" fill="#FFFFFF"/>
  <!-- Simple cross icon -->
  <rect x="555" y="454" width="6" height="30" rx="2" fill="#1A6B4A"/>
  <rect x="543" y="463" width="30" height="12" rx="2" fill="#1A6B4A"/>
  <text x="572" y="520" font-size="15" font-weight="800" fill="#0D2318" text-anchor="middle">Auxiliaire</text>
  <text x="572" y="540" font-size="15" font-weight="800" fill="#0D2318" text-anchor="middle">de vie</text>
  <text x="572" y="572" font-size="12" fill="#0D2318" fill-opacity="0.5" text-anchor="middle">Aide du quotidien</text>
  <text x="572" y="590" font-size="12" fill="#0D2318" fill-opacity="0.5" text-anchor="middle">toilette · repas</text>
  <rect x="492" y="616" width="160" height="3" rx="1.5" fill="#FF6B35"/>

  <!-- Column 2 -->
  <rect x="672" y="424" width="160" height="200" rx="6" fill="#FFFFFF"/>
  <!-- Simple eye/watch icon — two concentric arcs suggest watching -->
  <circle cx="752" cy="478" r="14" fill="none" stroke="#1A6B4A" stroke-width="4"/>
  <circle cx="752" cy="478" r="5" fill="#1A6B4A"/>
  <text x="752" y="520" font-size="15" font-weight="800" fill="#0D2318" text-anchor="middle">Garde-</text>
  <text x="752" y="540" font-size="15" font-weight="800" fill="#0D2318" text-anchor="middle">malade</text>
  <text x="752" y="572" font-size="12" fill="#0D2318" fill-opacity="0.5" text-anchor="middle">Surveillance</text>
  <text x="752" y="590" font-size="12" fill="#0D2318" fill-opacity="0.5" text-anchor="middle">jour · nuit</text>
  <rect x="672" y="616" width="160" height="3" rx="1.5" fill="#FF6B35"/>

  <!-- Column 3 -->
  <rect x="852" y="424" width="160" height="200" rx="6" fill="#FFFFFF"/>
  <!-- Simple doctor cross + circle head -->
  <circle cx="932" cy="456" r="12" fill="none" stroke="#1A6B4A" stroke-width="3.5"/>
  <rect x="928" y="470" width="8" height="18" rx="2" fill="#1A6B4A"/>
  <rect x="920" y="476" width="24" height="6" rx="2" fill="#1A6B4A"/>
  <text x="932" y="520" font-size="15" font-weight="800" fill="#0D2318" text-anchor="middle">Médecin</text>
  <text x="932" y="540" font-size="15" font-weight="800" fill="#0D2318" text-anchor="middle">à domicile</text>
  <text x="932" y="572" font-size="12" fill="#0D2318" fill-opacity="0.5" text-anchor="middle">Consultation</text>
  <text x="932" y="590" font-size="12" fill="#0D2318" fill-opacity="0.5" text-anchor="middle">ordonnance</text>
  <rect x="852" y="616" width="160" height="3" rx="1.5" fill="#FF6B35"/>

  <!-- Thin rule above contact -->
  <rect x="492" y="660" width="540" height="1.5" fill="#0D2318" fill-opacity="0.08"/>

  <!-- CONTACT BOX — solid orange -->
  <rect x="432" y="700" width="648" height="380" fill="#FF6B35"/>

  <!-- Contact label -->
  <text x="756" y="762" font-size="13" font-weight="700" fill="#FFFFFF" fill-opacity="0.75" text-anchor="middle" letter-spacing="3">NOUS APPELER</text>

  <!-- Phone 1 — large, bold, the star -->
  <rect x="492" y="780" width="540" height="110" rx="6" fill="#0D2318" fill-opacity="0.18"/>
  <text x="762" y="826" font-size="13" fill="#FFFFFF" fill-opacity="0.65" text-anchor="middle" letter-spacing="1">WhatsApp · Appel · SMS</text>
  <text x="762" y="874" font-size="46" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">+237 6 99 77 48 82</text>

  <!-- Phone 2 — large, bold -->
  <rect x="492" y="908" width="540" height="110" rx="6" fill="#0D2318" fill-opacity="0.18"/>
  <text x="762" y="954" font-size="13" fill="#FFFFFF" fill-opacity="0.65" text-anchor="middle" letter-spacing="1">WhatsApp · Appel · SMS</text>
  <text x="762" y="1002" font-size="46" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">+237 7 55 30 42 49</text>

  <!-- Footer strip -->
  <rect x="432" y="1056" width="648" height="24" fill="#0D2318" fill-opacity="0.3"/>
  <text x="756" y="1072" font-size="12" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle" letter-spacing="0.5">Personnel qualifié · Évaluation gratuite · Douala &amp; Yaoundé</text>

</svg>
