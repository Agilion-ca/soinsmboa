<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f4a33"/>
      <stop offset="100%" style="stop-color:#1A6B4A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.04"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#ff8f5e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <!-- Cercle décoratif -->
    <radialGradient id="circleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#4ade80;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Fond principal -->
  <rect width="1080" height="1080" fill="url(#bgGrad)"/>

  <!-- Cercles décoratifs de fond -->
  <circle cx="900" cy="150" r="280" fill="url(#circleGlow)"/>
  <circle cx="150" cy="900" r="200" fill="url(#circleGlow)"/>
  <circle cx="50" cy="200" r="120" fill="#ffffff" fill-opacity="0.03"/>
  <circle cx="1000" cy="850" r="160" fill="#ffffff" fill-opacity="0.03"/>

  <!-- Motif en points subtil -->
  <g fill="#ffffff" fill-opacity="0.05">
    <circle cx="100" cy="100" r="3"/><circle cx="200" cy="100" r="3"/><circle cx="300" cy="100" r="3"/>
    <circle cx="100" cy="200" r="3"/><circle cx="200" cy="200" r="3"/><circle cx="300" cy="200" r="3"/>
    <circle cx="100" cy="300" r="3"/><circle cx="200" cy="300" r="3"/>
    <circle cx="800" cy="800" r="3"/><circle cx="900" cy="800" r="3"/><circle cx="1000" cy="800" r="3"/>
    <circle cx="800" cy="900" r="3"/><circle cx="900" cy="900" r="3"/><circle cx="1000" cy="900" r="3"/>
  </g>

  <!-- ── HEADER ── -->
  <!-- Croix médicale -->
  <rect x="60" y="58" width="54" height="54" rx="14" fill="#FF6B35" filter="url(#softShadow)"/>
  <rect x="80" y="68" width="14" height="34" rx="4" fill="white"/>
  <rect x="68" y="80" width="38" height="14" rx="4" fill="white" x="68" y="80"/>

  <!-- Nom du site -->
  <text x="132" y="82" font-size="32" font-weight="800" fill="white" letter-spacing="-0.5">SoinsMboa</text>
  <text x="132" y="104" font-size="15" fill="#86efac" font-weight="500" letter-spacing="1">CAMEROUN</text>

  <!-- Badge disponible -->
  <rect x="820" y="58" width="200" height="36" rx="18" fill="#FF6B35" filter="url(#softShadow)"/>
  <circle cx="843" cy="76" r="6" fill="#fbbf24"/>
  <text x="858" y="81" font-size="15" fill="white" font-weight="700">Disponible 24h/24</text>

  <!-- Séparateur header -->
  <rect x="60" y="125" width="960" height="2" fill="#ffffff" fill-opacity="0.1"/>

  <!-- ── HERO TEXT ── -->
  <text x="540" y="220" font-size="62" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-1">Votre proche est malade</text>
  <text x="540" y="295" font-size="62" font-weight="900" text-anchor="middle" letter-spacing="-1">
    <tspan fill="#86efac">au Cameroun ?</tspan>
  </text>

  <text x="540" y="360" font-size="28" fill="#d1fae5" text-anchor="middle" font-weight="400">
    Nous envoyons un soignant qualifié en moins de 24h.
  </text>
  <text x="540" y="395" font-size="28" fill="#d1fae5" text-anchor="middle" font-weight="400">
    À domicile ou à l'hôpital. À Douala et Yaoundé.
  </text>

  <!-- ── CARDS SERVICES ── -->
  <!-- Card 1 -->
  <rect x="60" y="440" width="300" height="185" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" filter="url(#softShadow)"/>
  <!-- Icone cœur -->
  <circle cx="130" cy="490" r="30" fill="#FF6B35" fill-opacity="0.2"/>
  <text x="130" y="499" font-size="28" text-anchor="middle">🤝</text>
  <text x="210" y="485" font-size="20" font-weight="800" fill="white">Auxiliaire</text>
  <text x="210" y="508" font-size="20" font-weight="800" fill="white">de vie</text>
  <text x="80" y="545" font-size="15" fill="#d1fae5">Aide quotidienne,</text>
  <text x="80" y="565" font-size="15" fill="#d1fae5">toilette, repas, sorties</text>
  <text x="80" y="595" font-size="13" fill="#86efac" font-weight="600">→ Devis gratuit</text>

  <!-- Card 2 -->
  <rect x="390" y="440" width="300" height="185" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" filter="url(#softShadow)"/>
  <circle cx="460" cy="490" r="30" fill="#FF6B35" fill-opacity="0.2"/>
  <text x="460" y="499" font-size="28" text-anchor="middle">👁️</text>
  <text x="540" y="485" font-size="20" font-weight="800" fill="white">Garde-</text>
  <text x="540" y="508" font-size="20" font-weight="800" fill="white">malade</text>
  <text x="410" y="545" font-size="15" fill="#d1fae5">Surveillance jour/nuit,</text>
  <text x="410" y="565" font-size="15" fill="#d1fae5">clinique ou domicile</text>
  <text x="410" y="595" font-size="13" fill="#86efac" font-weight="600">→ Disponible 7j/7</text>

  <!-- Card 3 -->
  <rect x="720" y="440" width="300" height="185" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" filter="url(#softShadow)"/>
  <circle cx="790" cy="490" r="30" fill="#FF6B35" fill-opacity="0.2"/>
  <text x="790" y="499" font-size="28" text-anchor="middle">🩺</text>
  <text x="870" y="485" font-size="20" font-weight="800" fill="white">Médecin</text>
  <text x="870" y="508" font-size="20" font-weight="800" fill="white">à domicile</text>
  <text x="740" y="545" font-size="15" fill="#d1fae5">Consultation, ordonnance,</text>
  <text x="740" y="565" font-size="15" fill="#d1fae5">suivi post-opératoire</text>
  <text x="740" y="595" font-size="13" fill="#86efac" font-weight="600">→ Intervention rapide</text>

  <!-- ── STATS BAR ── -->
  <rect x="60" y="660" width="960" height="75" rx="16" fill="#ffffff" fill-opacity="0.08"/>
  <line x1="330" y1="675" x2="330" y2="720" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
  <line x1="600" y1="675" x2="600" y2="720" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
  <line x1="870" y1="675" x2="870" y2="720" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>

  <text x="195" y="698" font-size="28" font-weight="900" fill="#FF6B35" text-anchor="middle">+500</text>
  <text x="195" y="720" font-size="13" fill="#d1fae5" text-anchor="middle">Familles accompagnées</text>

  <text x="465" y="698" font-size="28" font-weight="900" fill="#FF6B35" text-anchor="middle">&lt;24h</text>
  <text x="465" y="720" font-size="13" fill="#d1fae5" text-anchor="middle">Délai d'intervention</text>

  <text x="735" y="698" font-size="28" font-weight="900" fill="#FF6B35" text-anchor="middle">2 villes</text>
  <text x="735" y="720" font-size="13" fill="#d1fae5" text-anchor="middle">Douala &amp; Yaoundé</text>

  <text x="965" y="698" font-size="28" font-weight="900" fill="#FF6B35" text-anchor="middle">7j/7</text>
  <text x="965" y="720" font-size="13" fill="#d1fae5" text-anchor="middle">Disponibilité</text>

  <!-- ── CONTACT SECTION ── -->
  <rect x="60" y="768" width="960" height="230" rx="20" fill="#FF6B35" filter="url(#shadow)"/>

  <!-- Déco coin -->
  <circle cx="980" cy="780" r="80" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="100" cy="980" r="60" fill="#ffffff" fill-opacity="0.08"/>

  <text x="540" y="818" font-size="26" font-weight="800" fill="white" text-anchor="middle" letter-spacing="0.5">NOUS APPELER MAINTENANT</text>

  <!-- Téléphone 1 -->
  <rect x="90" y="838" width="390" height="68" rx="14" fill="#ffffff" fill-opacity="0.2"/>
  <text x="285" y="866" font-size="14" fill="#fef3c7" text-anchor="middle" font-weight="600">📞 Téléphone / WhatsApp</text>
  <text x="285" y="893" font-size="26" font-weight="900" fill="white" text-anchor="middle">+237 6 99 77 48 82</text>

  <!-- Téléphone 2 -->
  <rect x="600" y="838" width="390" height="68" rx="14" fill="#ffffff" fill-opacity="0.2"/>
  <text x="795" y="866" font-size="14" fill="#fef3c7" text-anchor="middle" font-weight="600">📱 Téléphone / WhatsApp</text>
  <text x="795" y="893" font-size="26" font-weight="900" fill="white" text-anchor="middle">+237 7 55 30 42 49</text>

  <!-- WhatsApp badge + Zones -->
  <rect x="90" y="924" width="220" height="40" rx="20" fill="#25D366"/>
  <text x="200" y="948" font-size="16" font-weight="800" fill="white" text-anchor="middle">💬 WhatsApp</text>

  <text x="540" y="944" font-size="18" fill="white" text-anchor="middle" font-weight="600">📍 Douala &amp; Yaoundé — Personnel vérifié</text>

  <rect x="770" y="924" width="280" height="40" rx="20" fill="#ffffff" fill-opacity="0.25"/>
  <text x="910" y="948" font-size="15" font-weight="700" fill="white" text-anchor="middle">🌍 Diaspora bienvenue</text>

  <!-- ── FOOTER ── -->
  <text x="540" y="1050" font-size="13" fill="#86efac" text-anchor="middle" fill-opacity="0.8">
    SoinsMboa.com • Personnel qualifié &amp; formé • Évaluation gratuite
  </text>
</svg>
