<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1080" height="1080" viewBox="0 0 1080 1080"
     font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <!-- Top gradient: dark→transparent (pour lire le brand) -->
    <linearGradient id="g-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0D2318" stop-opacity="0.9"/>
      <stop offset="35%"  stop-color="#0D2318" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0D2318" stop-opacity="0"/>
    </linearGradient>
    <!-- Bottom gradient: transparent→dark (pour lire le headline) -->
    <linearGradient id="g-bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0D2318" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#0D2318" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0D2318" stop-opacity="1"/>
    </linearGradient>
    <!-- Orange badge gradient -->
    <linearGradient id="g-orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#e85a24"/>
    </linearGradient>
    <clipPath id="photo-clip">
      <rect x="0" y="0" width="1080" height="650"/>
    </clipPath>
  </defs>

  <!-- ── Base sombre ── -->
  <rect width="1080" height="1080" fill="#0D2318"/>

  <!-- ── Photo : infirmière noire en blouse bleue ── -->
  <image href="../images/service-garde.jpg"
         x="0" y="0" width="1080" height="650"
         preserveAspectRatio="xMidYMid slice"
         clip-path="url(#photo-clip)"/>

  <!-- Overlays gradient sur la photo -->
  <rect x="0" y="0"   width="1080" height="650" fill="url(#g-top)"/>
  <rect x="0" y="0"   width="1080" height="650" fill="url(#g-bottom)"/>
  <!-- Légère teinte verte sur le côté gauche pour lisibilité headline -->
  <rect x="0" y="350" width="520" height="300" fill="#0D2318" fill-opacity="0.45"/>

  <!-- ── HEADER : brand ── -->
  <rect x="60" y="62" width="48" height="4" rx="2" fill="#FF6B35"/>
  <text x="60" y="128" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">SoinsMboa</text>
  <text x="60" y="163" font-size="14" fill="#F8F5F0" fill-opacity="0.55" letter-spacing="4">SOINS À DOMICILE · CAMEROUN</text>

  <!-- Badge 24h/24 -->
  <rect x="876" y="60" width="144" height="40" rx="20" fill="url(#g-orange)"/>
  <text x="948" y="85" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">24h/24 · 7j/7</text>

  <!-- ── HEADLINE sur la photo ── -->
  <text x="60" y="456" font-size="62" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Votre parent est malade</text>
  <text x="60" y="530" font-size="62" font-weight="800" fill="#4ade80" letter-spacing="-1.5">au Cameroun ?</text>
  <text x="60" y="595" font-size="22" fill="#F8F5F0" fill-opacity="0.8" letter-spacing="0.2">Soignant qualifié · Intervention en moins de 24h</text>

  <!-- ── SECTION BAS ── -->
  <!-- Services row -->
  <text x="60" y="676" font-size="11" font-weight="700" fill="#FF6B35" letter-spacing="3.5">NOS SERVICES</text>

  <rect x="60"  y="692" width="300" height="46" rx="5" fill="#1A6B4A" fill-opacity="0.55"/>
  <rect x="60"  y="692" width="4"   height="46" rx="2" fill="#1A6B4A"/>
  <text x="210" y="720" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Auxiliaire de vie</text>

  <rect x="374" y="692" width="300" height="46" rx="5" fill="#1A6B4A" fill-opacity="0.55"/>
  <rect x="374" y="692" width="4"   height="46" rx="2" fill="#1A6B4A"/>
  <text x="524" y="720" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Garde-malade</text>

  <rect x="688" y="692" width="332" height="46" rx="5" fill="#FF6B35" fill-opacity="0.25"/>
  <rect x="688" y="692" width="4"   height="46" rx="2" fill="#FF6B35"/>
  <text x="855" y="720" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Médecin à domicile</text>

  <!-- Séparateur -->
  <rect x="60" y="758" width="960" height="1" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- Téléphone 1 — orange, le principal -->
  <rect x="60"  y="774" width="460" height="122" rx="8" fill="url(#g-orange)"/>
  <rect x="60"  y="774" width="460" height="122" rx="8" fill="#000000" fill-opacity="0.12"/>
  <text x="290" y="822" font-size="12" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle" letter-spacing="2.5">APPEL · WHATSAPP · SMS</text>
  <text x="290" y="872" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">+237 6 99 77 48 82</text>

  <!-- Téléphone 2 — outline -->
  <rect x="560" y="774" width="460" height="122" rx="8" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="560" y="774" width="460" height="122" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5"/>
  <text x="790" y="822" font-size="12" fill="#FFFFFF" fill-opacity="0.45" text-anchor="middle" letter-spacing="2.5">APPEL · WHATSAPP · SMS</text>
  <text x="790" y="872" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">+237 6 76 81 47 85</text>

  <!-- Diaspora -->
  <rect x="60" y="920" width="960" height="1" fill="#FFFFFF" fill-opacity="0.06"/>
  <text x="540" y="958" font-size="17" fill="#F8F5F0" fill-opacity="0.45" text-anchor="middle">Vous êtes à l'étranger ? Gérez tout par WhatsApp.</text>
  <text x="540" y="982" font-size="17" fill="#F8F5F0" fill-opacity="0.45" text-anchor="middle">Compte-rendu quotidien · France · Belgique · Canada</text>

  <!-- URL footer -->
  <rect x="0" y="1036" width="1080" height="44" fill="#000000" fill-opacity="0.35"/>
  <text x="540" y="1063" font-size="13" fill="#F8F5F0" fill-opacity="0.4" text-anchor="middle" letter-spacing="0.8">Personnel qualifié · Évaluation gratuite · SoinsMboa.com</text>
</svg>
